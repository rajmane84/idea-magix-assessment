services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot job: creates the bucket used by the backend and makes it publicly
  # readable (so uploaded PDFs/profile images can be served directly from MinIO).
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/prescripto &&
      mc anonymous set download local/prescripto
      "

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Overrides the values from backend/.env so the backend talks to the
      # dockerized Mongo/MinIO services instead of your local dev setup.
      MONGODB_URI: mongodb://mongodb:27017/prescripto
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET: prescripto
      S3_PUBLIC_URL: http://localhost:9000/prescripto
      S3_FORCE_PATH_STYLE: "true"
      SERVER_URL: http://localhost:5000
    ports:
      - "5000:5000"
    depends_on:
      mongodb:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

volumes:
  mongodb_data:
  minio_data:
